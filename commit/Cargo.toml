[package]
name = "p3-commit"
description = "A framework for implementing various cryptographic commitment schemes, including non-hiding variants."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
parallel = ["p3-maybe-rayon/parallel"]
secret-memory = ["dep:zeroize", "p3-matrix/secret-memory"]
test-utils = ["p3-challenger"]

[dependencies]
p3-dft.workspace = true
p3-field.workspace = true
p3-matrix.workspace = true
p3-maybe-rayon.workspace = true
p3-util.workspace = true

itertools.workspace = true
# The opening types derive their codecs, and they hold `Vec`s.
serde = { workspace = true, features = ["derive", "alloc"] }
thiserror.workspace = true
zeroize = { workspace = true, optional = true }

# for testing
p3-challenger = { workspace = true, optional = true }

[dev-dependencies]
p3-baby-bear = { path = "../baby-bear" }
p3-challenger = { path = "../challenger" }

rand.workspace = true

[lints]
workspace = true
