[package]
name = "p3-keccak"
description = "An optimized Keccak-f permutation with Keccak-256 and FIPS SHA-3 hash functions."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

# Criterion pulls Rayon transitively, which does not build for WASI.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion.workspace = true

# Picks the widest x86-64 backend the running CPU has, without `std`.
[target.'cfg(target_arch = "x86_64")'.dependencies]
cpufeatures.workspace = true

[dependencies]
p3-symmetric.workspace = true
p3-util.workspace = true
sha3 = { workspace = true, features = ["zeroize"] }

tiny-keccak = { workspace = true, features = ["keccak", "sha3"] }

[dev-dependencies]
p3-field = { path = "../field" }
p3-mersenne-31 = { path = "../mersenne-31" }

hex-literal.workspace = true
proptest.workspace = true

[[bench]]
name = "bench_keccak"
harness = false

[lints]
workspace = true

