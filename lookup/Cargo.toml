[package]
name = "p3-lookup"
description = "LogUp: Logarithmic lookup arguments and multiset equality checks with multiplicities support."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
parallel = ["p3-maybe-rayon/parallel"]
secret-memory = ["p3-field/secret-memory", "p3-matrix/secret-memory", "zeroize"]

[dependencies]
hashbrown = { workspace = true }
itertools = { workspace = true }
num-bigint = { workspace = true }
p3-air = { workspace = true }
p3-field = { workspace = true }
p3-matrix = { workspace = true }
p3-maybe-rayon = { workspace = true }
serde = { workspace = true, features = ["derive", "alloc"] }
thiserror.workspace = true
tracing = { workspace = true }
zeroize = { workspace = true, optional = true }

[dev-dependencies]
criterion.workspace = true
p3-baby-bear = { path = "../baby-bear", features = ["secret-memory"] }
rand.workspace = true
serde_json.workspace = true

[[bench]]
name = "logup"
harness = false

[lints]
workspace = true
