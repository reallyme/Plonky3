[dev-dependencies]
p3-goldilocks = { path = "../goldilocks" }
p3-koala-bear = { path = "../koala-bear" }

postcard = { workspace = true, features = ["alloc"] }
proptest.workspace = true
serde_json.workspace = true

[lints]
workspace = true
