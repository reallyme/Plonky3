[package]
name = "p3-sha256-air"
description = "An AIR implementation of the SHA-256 compression function for use in zero-knowledge proof systems."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
parallel = ["p3-maybe-rayon/parallel"]
secret-memory = ["p3-matrix/secret-memory", "dep:thiserror"]

[dependencies]
p3-air.workspace = true
p3-field.workspace = true
p3-matrix.workspace = true
p3-maybe-rayon.workspace = true

rand.workspace = true
thiserror = { workspace = true, optional = true }
tracing.workspace = true
zeroize.workspace = true

[dev-dependencies]
p3-baby-bear = { path = "../baby-bear", features = ["secret-memory"] }
p3-binary-field = { path = "../binary-field" }
p3-challenger = { path = "../challenger" }
p3-commit = { path = "../commit" }
p3-dft = { path = "../dft" }
p3-fri = { path = "../fri" }
p3-keccak = { path = "../keccak" }
p3-merkle-tree = { path = "../merkle-tree" }
p3-monty-31 = { path = "../monty-31" }
p3-symmetric = { path = "../symmetric" }
p3-uni-stark = { path = "../uni-stark" }

criterion = { version = "0.8", features = ["html_reports"] }
proptest.workspace = true
sha2.workspace = true

[[bench]]
name = "sha256-air"
harness = false

[lints]
workspace = true
