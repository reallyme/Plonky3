[package]
name = "p3-matrix"
description = "A matrix library providing common matrix operations and traits for finite field elements."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
parallel = ["p3-maybe-rayon/parallel"]
secret-memory = ["dep:thiserror", "dep:zeroize"]

[dependencies]

itertools.workspace = true
p3-field.workspace = true
p3-maybe-rayon.workspace = true
p3-util.workspace = true
rand.workspace = true
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true, optional = true }
tracing.workspace = true
zeroize = { workspace = true, optional = true }

[dev-dependencies]
p3-baby-bear = { path = "../baby-bear", features = ["secret-memory"] }
p3-binary-field = { path = "../binary-field" }
p3-goldilocks = { path = "../goldilocks" }
p3-mersenne-31 = { path = "../mersenne-31" }
rand = { workspace = true, features = ["std_rng"] }

criterion.workspace = true
proptest.workspace = true

[[bench]]
name = "transpose_benchmark"
path = "benches/transpose_benchmark.rs"
harness = false

[[bench]]
name = "columnwise_dot_product"
path = "benches/columnwise_dot_product.rs"
harness = false

[[bench]]
name = "interpolation"
path = "benches/interpolation.rs"
harness = false

[[bench]]
name = "vertical_packing"
path = "benches/vertical_packing.rs"
harness = false

[[bench]]
name = "bitrev_vertical_packing"
path = "benches/bitrev_vertical_packing.rs"
harness = false

[[bench]]
name = "bit_reverse"
harness = false

[lints]
workspace = true
