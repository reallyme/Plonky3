[package]
name = "p3-dft"
description = "A collection of discrete Fourier transform (DFT) implementations for finite fields."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
parallel = ["p3-maybe-rayon/parallel"]
secret-memory = [
    "dep:thiserror",
    "dep:zeroize",
    "p3-field/secret-memory",
    "p3-matrix/secret-memory",
]

[dependencies]
p3-field.workspace = true
p3-matrix.workspace = true
p3-maybe-rayon.workspace = true
p3-util.workspace = true

itertools.workspace = true
spin.workspace = true
thiserror = { workspace = true, optional = true }
tracing.workspace = true
zeroize = { workspace = true, optional = true }

[dev-dependencies]
p3-baby-bear = { path = "../baby-bear", features = ["secret-memory"] }
p3-goldilocks = { path = "../goldilocks" }
p3-mersenne-31 = { path = "../mersenne-31" }
p3-monty-31 = { path = "../monty-31" }

criterion.workspace = true
proptest.workspace = true
rand.workspace = true
rayon.workspace = true

[[bench]]
name = "fft"
harness = false

[[bench]]
name = "padded"
harness = false

[lints]
workspace = true
